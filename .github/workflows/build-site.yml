name: Build Site

on:
  push:
    branches: [main]
    paths: ["src/**", "scripts/build_site.py", ".github/workflows/build-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pygments
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
