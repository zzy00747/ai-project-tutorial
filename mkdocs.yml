site_name: AI 项目实战
site_description: 从零生成、验收到持续维护 —— 用一个真实项目掌握需求、规格、编码、测试、部署、演化与 AI 工程化协作
site_url: ""
repo_url: https://github.com/zzy00747/ai-project-tutorial
repo_name: zzy00747/ai-project-tutorial
edit_uri: edit/main/src/
copyright: AI 项目实战 · 仅供学习使用

docs_dir: src
site_dir: site

