[book]
title = "AI 项目实战：从零生成、验收到持续维护"
authors = ["zzy"]
language = "zh-cn"
src = "src"

[build]
extra-watch-dirs = []

[output.html]
default-theme = "light"
preferred-dark-theme = "mocha"
additional-css = ["theme/catppuccin.css", "theme/custom.css"]
additional-js = ["theme/pagetoc.js"]
git-repository-url = "https://github.com/zzy00747/ai-project-tutorial"
edit-url-template = "https://github.com/zzy00747/ai-project-tutorial/edit/main/{path}"
site-url = "/"
cname = ""

[output.html.search]
enable = true
limit-results = 15
teaser-word-count = 60
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[output.html.playground]
editable = false

[preprocessor.pagetoc]
